name: SAATHI Android Build, Verification & APK Export

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: '15859902'
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: false
          packages: platform-tools

      - name: Install Required Android SDK Packages
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$SDK_ROOT" ] || [ ! -d "$SDK_ROOT" ]; then
            echo "::error::Android SDK root directory not found (ANDROID_HOME='${ANDROID_HOME:-}', ANDROID_SDK_ROOT='${ANDROID_SDK_ROOT:-}')."
            exit 1
          fi
          if [ -n "${ANDROID_HOME:-}" ] && [ -n "${ANDROID_SDK_ROOT:-}" ]; then
            HOME_REAL="$(readlink -f "$ANDROID_HOME")"
            ROOT_REAL="$(readlink -f "$ANDROID_SDK_ROOT")"
            if [ "$HOME_REAL" != "$ROOT_REAL" ]; then
              echo "::error::Conflicting Android SDK roots detected: ANDROID_HOME=$HOME_REAL vs ANDROID_SDK_ROOT=$ROOT_REAL"
              exit 1
            fi
          fi

          # Prefer the cmdline-tools sdkmanager inside SDK_ROOT (never a stale system binary outside SDK_ROOT)
          if [ -x "$SDK_ROOT/cmdline-tools/22.0/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/22.0/bin/sdkmanager"
          elif [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -type f -name sdkmanager 2>/dev/null | sort -V | tail -n 1 || true)"
          fi

          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "::error::Could not locate executable sdkmanager inside $SDK_ROOT/cmdline-tools."
            exit 1
          fi

          # Ensure subsequent steps resolve this exact cmdline-tools bin first on PATH
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"

          echo "Installing required SDK packages for compileSdk=36.1, targetSdk=36, AGP=9.1.1..."
          if ! "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install \
            "platform-tools" \
            "platforms;android-36.1" \
            "platforms;android-36" \
            "build-tools;36.0.0" < /dev/null; then
            echo "::error::Failed to install one or more required Android SDK packages (platform-tools, platforms;android-36.1, platforms;android-36, build-tools;36.0.0)."
            exit 1
          fi

      - name: Verify Android SDK & Toolchain Before Gradle
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          echo "=== Java Version ==="
          java -version 2>&1
          echo "=== Android SDK Environment ==="
          echo "ANDROID_HOME=${ANDROID_HOME:-<unset>}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-<unset>}"
          echo "which sdkmanager=$(command -v sdkmanager || echo '<not on PATH>')"
          echo "resolved SDKMANAGER=${SDKMANAGER:-<unset>}"
          echo "=== sdkmanager Version ==="
          "$SDKMANAGER" --version
          echo "=== Installed Android Platforms ==="
          ls -1 "$SDK_ROOT/platforms"
          echo "=== Installed Build-Tools ==="
          ls -1 "$SDK_ROOT/build-tools"

          for required_dir in \
            "$SDK_ROOT/platform-tools" \
            "$SDK_ROOT/platforms/android-36.1" \
            "$SDK_ROOT/platforms/android-36" \
            "$SDK_ROOT/build-tools/36.0.0"; do
            if [ ! -d "$required_dir" ]; then
              echo "::error::Required Android SDK directory is missing after setup: $required_dir"
              exit 1
            fi
          done

          RESOLVED_PATH="$(readlink -f "$(command -v sdkmanager)")"
          EXPECTED_PATH="$(readlink -f "$SDKMANAGER")"
          if [ "$RESOLVED_PATH" != "$EXPECTED_PATH" ]; then
            echo "::error::sdkmanager on PATH ($RESOLVED_PATH) does not match configured SDKMANAGER ($EXPECTED_PATH)."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Debug Signing Keystore
        run: |
          set -euo pipefail
          if [ -s debug.keystore ]; then
            if keytool -list -keystore debug.keystore -storepass android -alias androiddebugkey >/dev/null 2>&1; then
              echo "Using existing valid debug.keystore."
            else
              echo "::warning::Existing debug.keystore is invalid; removing and regenerating."
              rm -f debug.keystore
            fi
          fi

          if [ ! -s debug.keystore ] && [ -s debug.keystore.base64 ]; then
            echo "Found optional debug.keystore.base64; decoding..."
            if base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null \
              && [ -s debug.keystore ] \
              && keytool -list -keystore debug.keystore -storepass android -alias androiddebugkey >/dev/null 2>&1; then
              echo "Restored valid debug.keystore from debug.keystore.base64."
            else
              echo "::warning::debug.keystore.base64 failed to decode or validate; generating standard debug.keystore instead."
              rm -f debug.keystore
            fi
          fi

          if [ ! -s debug.keystore ]; then
            echo "No valid debug.keystore or debug.keystore.base64 present; generating standard Android debug.keystore for CI debug signing."
            keytool -genkeypair \
              -keystore debug.keystore \
              -storetype PKCS12 \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -sigalg SHA256withRSA \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US" \
              -noprompt
          fi

          test -s debug.keystore
          keytool -list -keystore debug.keystore -storepass android -alias androiddebugkey

      - name: Prepare & Validate Firebase google-services.json
        id: firebase_config
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            if ! printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | tr -d '\r\n ' | base64 -d > app/google-services.json 2>/dev/null; then
              rm -f app/google-services.json
              echo "::error::GitHub Actions secret GOOGLE_SERVICES_JSON_BASE64 is not valid Base64. Encode the Firebase google-services.json file with: base64 -w 0 app/google-services.json"
              exit 1
            fi
            echo "from_secret=true" >> "$GITHUB_OUTPUT"
            echo "Decoded app/google-services.json from GOOGLE_SERVICES_JSON_BASE64 secret."
          elif [ -s app/google-services.json ]; then
            echo "from_secret=false" >> "$GITHUB_OUTPUT"
            echo "Using existing app/google-services.json."
          else
            echo "::error::Missing app/google-services.json. Add the GitHub Actions repository secret GOOGLE_SERVICES_JSON_BASE64 (base64-encoded contents of google-services.json for Firebase project gen-lang-client-0541897442) in Settings -> Secrets and variables -> Actions."
            exit 1
          fi

          if [ ! -s app/google-services.json ]; then
            echo "::error::Decoded app/google-services.json is empty."
            exit 1
          fi

          python3 - <<'PY'
          import json, sys

          path = "app/google-services.json"
          expected_project_id = "gen-lang-client-0541897442"
          expected_pkg = "com.aistudio.saathi.x7k9qm"

          try:
              with open(path, "r", encoding="utf-8") as f:
                  data = json.load(f)
          except Exception as exc:
              print(f"::error::app/google-services.json is not valid JSON ({type(exc).__name__}). Verify GOOGLE_SERVICES_JSON_BASE64 encodes the raw JSON file.")
              sys.exit(1)

          if not isinstance(data, dict):
              print("::error::app/google-services.json root must be a JSON object.")
              sys.exit(1)

          project_id = str((data.get("project_info") or {}).get("project_id") or "").strip()
          if not project_id:
              print("::error::app/google-services.json is missing project_info.project_id.")
              sys.exit(1)
          if project_id != expected_project_id:
              print(
                  f"::error::app/google-services.json belongs to a different Firebase project (expected '{expected_project_id}'). "
                  "Download google-services.json from the SAATHI Firebase project and update GOOGLE_SERVICES_JSON_BASE64."
              )
              sys.exit(1)

          clients = data.get("client")
          if not isinstance(clients, list) or len(clients) == 0:
              print("::error::app/google-services.json has no 'client' entries.")
              sys.exit(1)

          matched = None
          for c in clients:
              if not isinstance(c, dict):
                  continue
              pkg = str(((c.get("client_info") or {}).get("android_client_info") or {}).get("package_name") or "").strip()
              if pkg == expected_pkg:
                  matched = c
                  break

          if not matched:
              print(f"::error::app/google-services.json does not contain an Android client entry for package '{expected_pkg}'.")
              sys.exit(1)

          app_id = str((matched.get("client_info") or {}).get("mobilesdk_app_id") or "").strip()
          if not app_id:
              print(f"::error::app/google-services.json client entry for '{expected_pkg}' is missing mobilesdk_app_id.")
              sys.exit(1)

          api_keys = matched.get("api_key") or []
          has_api_key = any(
              isinstance(k, dict) and isinstance(k.get("current_key"), str) and k["current_key"].strip()
              for k in api_keys
          )
          if not has_api_key:
              print(f"::error::app/google-services.json client entry for '{expected_pkg}' is missing api_key.current_key.")
              sys.exit(1)

          print(f"Validated app/google-services.json for project '{expected_project_id}' and package '{expected_pkg}' (mobilesdk_app_id and api_key verified for Firebase Core, AI Logic, Firestore & App Check).")
          PY

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase CLI, Rules Test SDK & Backend Dependencies
        run: |
          npm install -g firebase-tools
          npm install --prefix /tmp/rules-test --no-save @firebase/rules-unit-testing
          npm --prefix backend install

      - name: Run Backend Voice Proxy Tests
        run: node --test backend/server.test.js

      - name: Start Firebase Auth & Firestore Emulators and Run Full Verification Suite
        run: |
          set -euo pipefail
          firebase emulators:start --only auth,firestore --project gen-lang-client-0541897442 > /tmp/firebase-emulator.log 2>&1 &
          EMULATOR_PID=$!
          trap 'kill $EMULATOR_PID 2>/dev/null || true' EXIT

          READY=0
          for i in $(seq 1 90); do
            if curl -s http://127.0.0.1:8085 >/dev/null && curl -s http://127.0.0.1:9099 >/dev/null; then
              echo "Firebase Auth (9099) & Firestore (8085) emulators are ready."
              READY=1
              break
            fi
            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            echo "ERROR: Firebase Auth/Firestore emulators failed to become ready within 90s."
            cat /tmp/firebase-emulator.log || true
            exit 1
          fi

          NODE_PATH=/tmp/rules-test/node_modules FIRESTORE_EMULATOR_HOST="127.0.0.1:8085" node --test firestore.test.js
          gradle :app:processDebugGoogleServices :app:processReleaseGoogleServices :app:testDebugUnitTest :app:assembleDebug :app:compileReleaseKotlin --console=plain

          for res_file in \
            app/build/generated/res/processDebugGoogleServices/values/values.xml \
            app/build/generated/res/processReleaseGoogleServices/values/values.xml; do
            test -s "$res_file"
            for res_name in google_app_id google_api_key project_id; do
              if ! grep -q "name=\"${res_name}\"" "$res_file"; then
                echo "::error::Expected generated Firebase resource '${res_name}' missing from ${res_file}"
                exit 1
              fi
            done
          done
          echo "Verified Firebase resources (google_app_id, google_api_key, project_id) generated for both debug and release builds."

          node -e '
            const fs = require("node:fs");
            const xmlPath = "app/build/test-results/testDebugUnitTest/TEST-com.example.data.repository.FirestoreRepositoryRuleTest.xml";
            const xml = fs.readFileSync(xmlPath, "utf8");
            const tests = Number((xml.match(/tests="(\d+)"/) || [])[1] || 0);
            const skipped = Number((xml.match(/skipped="(\d+)"/) || [])[1] || 0);
            const failures = Number((xml.match(/failures="(\d+)"/) || [])[1] || 0);
            const errors = Number((xml.match(/errors="(\d+)"/) || [])[1] || 0);
            console.log({ tests, skipped, failures, errors });
            if (tests < 4 || skipped > 0 || failures > 0 || errors > 0) {
              throw new Error("FirestoreRepositoryRuleTest must execute all 4 emulator tests with 0 skipped/failures/errors.");
            }
          '

      - name: Verify & Stage Generated Debug APK
        run: |
          set -euo pipefail
          APK_SRC="app/build/outputs/apk/debug/app-debug.apk"
          APK_STAGE="${{ runner.temp }}/artifacts/debug/app-debug.apk"
          test -s "$APK_SRC"
          ls -lh "$APK_SRC"
          BUILD_TOOLS_DIR=$(ls -1d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools/"* | sort -V | tail -n 1)
          AAPT2="${BUILD_TOOLS_DIR}/aapt2"
          APKSIGNER="${BUILD_TOOLS_DIR}/apksigner"
          BADGING=$("$AAPT2" dump badging "$APK_SRC")
          echo "$BADGING" | grep -E "^(package:|application-label:|sdkVersion:|targetSdkVersion:)"
          if ! echo "$BADGING" | grep -q "package: name='com.aistudio.saathi.x7k9qm'"; then
            echo "::error::Debug APK package name mismatch. Expected 'com.aistudio.saathi.x7k9qm'."
            exit 1
          fi
          "$APKSIGNER" verify --verbose "$APK_SRC"
          mkdir -p "$(dirname "$APK_STAGE")"
          cp "$APK_SRC" "$APK_STAGE"
          test -s "$APK_STAGE"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SAATHI-Android-debug-APK
          path: ${{ runner.temp }}/artifacts/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Check Optional Release Signing Secrets
        id: release_signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "${GITHUB_WORKSPACE}/my-upload-key.jks"
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "Release signing secrets not configured; skipping signed release APK generation."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build, Verify & Stage Signed Release APK (When Signing Secrets Are Configured)
        if: steps.release_signing.outputs.configured == 'true'
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-upload-key.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          gradle :app:assembleRelease --console=plain
          APK_SRC="app/build/outputs/apk/release/app-release.apk"
          APK_STAGE="${{ runner.temp }}/artifacts/release/app-release.apk"
          test -s "$APK_SRC"
          ls -lh "$APK_SRC"
          BUILD_TOOLS_DIR=$(ls -1d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools/"* | sort -V | tail -n 1)
          AAPT2="${BUILD_TOOLS_DIR}/aapt2"
          APKSIGNER="${BUILD_TOOLS_DIR}/apksigner"
          BADGING=$("$AAPT2" dump badging "$APK_SRC")
          echo "$BADGING" | grep -E "^(package:|application-label:|sdkVersion:|targetSdkVersion:)"
          if ! echo "$BADGING" | grep -q "package: name='com.aistudio.saathi.x7k9qm'"; then
            echo "::error::Release APK package name mismatch. Expected 'com.aistudio.saathi.x7k9qm'."
            exit 1
          fi
          "$APKSIGNER" verify --verbose "$APK_SRC"
          mkdir -p "$(dirname "$APK_STAGE")"
          cp "$APK_SRC" "$APK_STAGE"
          test -s "$APK_STAGE"

      - name: Upload Signed Release APK Artifact
        if: steps.release_signing.outputs.configured == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: SAATHI-Android-release-APK
          path: ${{ runner.temp }}/artifacts/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Failure Diagnostic Logs & Test Reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: SAATHI-CI-failure-logs
          path: |
            app/build/reports/tests/
            app/build/test-results/
            /tmp/firebase-emulator.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Clean Up Ephemeral Keystore & Firebase Config
        if: always()
        run: |
          rm -f "${GITHUB_WORKSPACE}/my-upload-key.jks"
          if [ "${{ steps.firebase_config.outputs.from_secret }}" = "true" ]; then
            rm -f app/google-services.json
          fi


